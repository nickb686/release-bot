# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
[[repos]]
repo = "https://github.com/henryiii/validate-pyproject-schema-store"
rev = "b66c4f3deeb917e23001469a8ba618b7d620ac09"  # frozen: 2026.09.19
hooks = [
  { id = "validate-pyproject" }
]


[[repos]]
repo = "builtin"
hooks = [
  { id = "no-commit-to-branch" },
  { id = "fix-byte-order-marker" },
  { id = "end-of-file-fixer" },
  {
    id = "mixed-line-ending",
    args = ["--fix=lf"]
  },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-executables-have-shebangs" },
  { id = "check-vcs-permalinks" },
  { id = "check-merge-conflict" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "2eeb5678de71a00c0902cbda7105d328432f72cb"  # frozen: v0.16.8
hooks = [
  {
    id = "ruff-check",
    args = ["--fix"]
  },
  { id = "ruff-format" }
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "9b16a472943852b803af3785c45041dcf10b9f12"  # frozen: 0.12.18
hooks = [
  { id = "uv-lock" }
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"  # frozen: v8.30.1
hooks = [
  { id = "gitleaks" }
]

[[repos]]
repo = "https://github.com/facebook/pyrefly-pre-commit"
rev = "c0d19edcfcf4c0bbd7bca2636fb6c9cf82c76bcd"  # frozen: 1.3.1
hooks = [
  {
    id = "pyrefly-check",
    name = "Pyrefly (type checking)",
    pass_filenames = false,
    language = "system"
  }
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
hooks = [
  { id = "actionlint" }
]

[update]
cooldown_days = 7
freeze = true
exclude_tags = ["*-{alpha,beta,rc}*", "*.dev*"]
