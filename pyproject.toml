[project]
name = "release-bot"
version = "0.1.0"
requires-python = "==3.14.7"
dependencies = [
  "aiogram==3.31.0",
  "aiosqlite==0.22.1",
  "alembic==1.20.0",
  "apscheduler==3.11.3",
  "apscheduler-dishka==1.1.1",
  "dishka==1.10.1",
  "fastapi[standard-no-fastapi-cloud-cli]==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pygithub==2.10.0",
  "requirements-parser==0.13.1",
  "sqlalchemy[asyncio]==2.1.1",
  "sulguk==0.12.0",
  "telegramify-markdown==1.4.0",
  "urllib3==2.8.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff>=0.15.22",
  "pyrefly==1.3.2",
  "prek==0.5.4",
]

[tool.ruff]
extend-exclude = ["**/alembic/*"]
target-version = "py314"
line-length = 88
indent-width = 4

[tool.ruff.lint]
extend-select = [
  "S",
  "E",
  "W",
  "F",
  "I",
  "UP",
  "TC",
  "FA",
  "B",
  "SIM",
  "ISC",
  "COM",
  "C4",
  "RET",
  "RUF",
  "ASYNC",
  "A",
  "PLC",
  "PLE",
  "PLW",
  "PIE",
  "PT",
  "PTH",
  "ISC",
  "PERF",
  "FURB",
  "LOG",
  "G",
]
ignore = ["E501", "RUF001", "COM812"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pyrefly]
project-includes = ["app"]
project-excludes = ["**/alembic/**"]
python-version = "3.14"
preset = "strict"
