# Configuration file for pre-commit.
# See https://pre-commit.com/ for more information.

repos:
  - repo: https://github.com/henryiii/validate-pyproject-schema-store
    rev: 0f501925223a9e9dabd603d07afa0777826b0e9a  # frozen: 2026.10.22
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: no-commit-to-branch
      - id: fix-byte-order-marker
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ --fix=lf ]
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-executables-have-shebangs
      - id: check-vcs-permalinks
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: eeca16c54e09b4d9a848259e46bae14737944348  # frozen: 0.13.5
    hooks:
      - id: uv-lock

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 442488886535c5e530391851a63d96c775477eda  # frozen: 1.4.0
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        pass_filenames: false
        language: system

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

update:
  cooldown_days: 3
  freeze: true
  exclude_tags: [ "*-{alpha,beta,rc}*", "*.dev*" ]
