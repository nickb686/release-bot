name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ main ]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version-file: 'pyproject.toml'

      - name: Install dependencies
        run: uv sync --locked --group dev && uv tool install pyrefly

      - name: Run lint and tests
        uses: j178/prek-action@v3.0.0

  build-docker:
    needs:
      - build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ${{ env.REGISTRY }} registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            #type=semver,pattern={{major}}.{{minor}}
            #type=semver,pattern={{major}}

      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test

      - name: Test
        run: |
          set -euo pipefail

          container_id=$(docker run -d -p 8000:8000 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test")

          cleanup() {
            docker logs "$container_id" || true
            docker stop "$container_id" >/dev/null 2>&1 || true
            docker rm "$container_id" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          echo "Waiting for application to become ready..."

          for i in {1..60}; do
            if curl --fail --silent --show-error \
              --max-time 2 \
              http://localhost:8000/ >/dev/null; then
              echo "Application is ready."
              exit 0
            fi

            if ! docker inspect "$container_id" \
              --format '{{.State.Running}}' | grep -q true; then
              echo "Container stopped unexpectedly."
              docker logs "$container_id"
              exit 1
            fi

            sleep 1
          done

          echo "Application did not become ready within 60 seconds."
          docker logs "$container_id"
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs:
      - build-and-test
      - build-docker

    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
