version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: saturday
      time: "17:00"
      timezone: Asia/Tashkent
    cooldown:
      default-days: 7
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: saturday
      time: "17:00"
      timezone: Asia/Tashkent
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: "weekly"
      day: saturday
      time: "17:00"
      timezone: Asia/Tashkent
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - "*"
